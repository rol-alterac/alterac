<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alterac</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="ui/favicon.png">
</head>
<body>

  <button id="boton-alterac" onclick="var m=['alterac','stromgarde','lago'];var s=+this.dataset.s||0;s=(s+1)%3;this.dataset.s=s;this.querySelector('img').src='ui/'+m[s]+'.png';window.cambiarRegion(m[s])"><img id="alterac-img" src="ui/alterac.png"></button>

  <div id="map"></div>

  <!-- Barra de sesión -->
  <div id="barra-sesion">
    <span id="info-usuario">Cargando...</span>
    <button id="btn-login"  onclick="loginGoogle()"  class="oculto">Iniciar sesión con Google</button>
    <button id="btn-logout" onclick="logoutGoogle()" class="oculto">Cerrar sesión</button>
  </div>

  <!-- Ventanas independientes del panel -->
  <div id="wnd-png" class="ventana-panel oculto"></div>

  <div id="wnd-titulo" class="ventana-panel oculto">
    <div class="ventana-barra" onmousedown="iniciarArrastre(this.parentElement, event)"></div>
    <div class="ventana-cuerpo" id="wnd-titulo-body"></div>
  </div>

  <div id="wnd-texto" class="ventana-panel oculto">
    <div class="ventana-barra" onmousedown="iniciarArrastre(this.parentElement, event)"></div>
    <div id="wnd-texto-body"></div>
  </div>

  <div id="wnd-imagen" class="ventana-panel oculto">
    <div class="ventana-barra" onmousedown="iniciarArrastre(this.parentElement, event)"></div>
    <div class="ventana-cuerpo" id="wnd-imagen-body"></div>
  </div>

  <div id="wnd-botones" class="ventana-panel oculto">
    <div class="ventana-barra" onmousedown="iniciarArrastre(this.parentElement, event)"></div>
    <div class="ventana-cuerpo" id="wnd-botones-body"></div>
  </div>

  <!-- Botón cerrar global -->
  <div id="wnd-cerrar" class="oculto" onclick="cerrarPanel()"></div>

  <!-- Herramientas de dibujo -->
  <div id="herramientas-dibujo" class="oculto">
    <button id="btn-dibujar" class="herramienta-btn activo" onclick="seleccionarHerramienta('dibujar')">Crear</button>
    <button id="btn-borrar" class="herramienta-btn" onclick="seleccionarHerramienta('borrar')">Borrar</button>
    <button id="btn-estilo" class="herramienta-btn" onclick="seleccionarHerramienta('estilo')">Estilo</button>
  </div>

  <!-- Botón añadir marca -->
  <button id="btn-añadir" class="oculto" onclick="activarModoPin()">Añadir marca</button>

  <!-- Instrucción modo marca -->
  <div id="instruccion" class="oculto">
    Haz clic en el mapa para colocar la marca
    <button onclick="cancelarModoPin()">Cancelar</button>
  </div>

  <!-- Modal edición marca -->
  <!-- Modal tamaño de icono -->
  <div id="modal-tamaño" class="oculto">
    <div id="modal-tamaño-caja">
      <h2>🔍 Tamaño del icono</h2>
      <div class="tamaño-slider-row">
        <input type="range" id="tamaño-slider" min="0.5" max="5" step="0.1" value="1" />
        <span id="tamaño-valor">1.0×</span>
      </div>
      <div class="tamaño-hints">
        <span>0.5×</span>
        <span>normal: 1×</span>
        <span>5×</span>
      </div>
      <button id="btn-guardar-tamaño" onclick="guardarTamaño()">💾 Guardar tamaño</button>
      <button class="btn-secundario" onclick="cerrarModalTamaño()">Cancelar</button>
    </div>
  </div>

  <!-- Modal estilo polígono -->
  <div id="modal-estilo" class="oculto">
    <div id="modal-estilo-caja">
      <h2>Estilo del área</h2>

      <label>Grosor de línea</label>
      <div class="estilo-slider-row">
        <input type="range" id="estilo-line-weight" min="1" max="12" step="1" value="4" />
        <span id="estilo-line-weight-val">4</span>
      </div>

      <label>Tipo de línea</label>
      <select id="estilo-line-type" class="estilo-select">
        <option value="solid">Sólida</option>
        <option value="dashed">Discontinua</option>
        <option value="dotted">Punteada</option>
      </select>

      <label>Color de línea</label>
      <input type="color" id="estilo-line-color" value="#ff5050" class="estilo-color" />

      <div class="estilo-sep"></div>

      <label>Color de relleno</label>
      <input type="color" id="estilo-fill-color" value="#ff5050" class="estilo-color" />

      <label>Opacidad de relleno</label>
      <div class="estilo-slider-row">
        <input type="range" id="estilo-fill-opacity" min="0" max="100" step="5" value="35" />
        <span id="estilo-fill-opacity-val">35%</span>
      </div>

      <label>Tipo de relleno</label>
      <select id="estilo-fill-type" class="estilo-select">
        <option value="solid">Sólido</option>
        <option value="none">Ninguno</option>
        <option value="hatch">Rayado</option>
      </select>

      <div class="estilo-btns">
        <button id="btn-aplicar-estilo" onclick="aplicarEstilo()">Aplicar</button>
        <button class="btn-secundario" onclick="cerrarModalEstilo()">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Panel de ajustes temporales -->
  <script type="module" src="app.js"></script>
  <script type="module" src="dibujo.js"></script>

  <script>
    // Create-mode position defaults
    window.crearPos = {
      png: { top: -295, left: 434, scale: 175 },
      tit: { top: 85, left: 480, scale: 121, 'inp-h': 32, 'inp-w': 578, 'sel-w': 372 },
      txt: { top: 185, left: 478, w: 616, h: 540 },
      img: { top: 266, left: 1113, scale: 97 },
      btns: { top: 641, left: 1122, gap: 9, btnW: 144, btnH: 41, scale: 100 },
      cerrar: { top: 713, left: 1414, scale: 125 },
    };
    window.aplicarCrearPos = function() {
      const p = window.crearPos;
      const s = p.png.scale / 100;
      document.getElementById('wnd-png').style.top = p.png.top + 'px';
      document.getElementById('wnd-png').style.left = p.png.left + 'px';
      document.getElementById('wnd-png').style.width = Math.round(600 * s) + 'px';
      document.getElementById('wnd-png').style.height = Math.round(800 * s) + 'px';
      document.getElementById('wnd-png').style.transform = 'none';
      document.getElementById('wnd-titulo').style.top = p.tit.top + 'px';
      document.getElementById('wnd-titulo').style.left = p.tit.left + 'px';
      document.getElementById('wnd-titulo').style.width = Math.round(526 * p.tit.scale / 100) + 'px';
      document.getElementById('wnd-titulo-body').style.transform = 'none';
      document.documentElement.style.setProperty('--crear-inp-h', p.tit['inp-h'] + 'px');
      document.documentElement.style.setProperty('--crear-inp-w', p.tit['inp-w'] + 'px');
      document.documentElement.style.setProperty('--crear-sel-w', p.tit['sel-w'] + 'px');
      document.getElementById('wnd-texto').style.top = p.txt.top + 'px';
      document.getElementById('wnd-texto').style.left = p.txt.left + 'px';
      document.getElementById('wnd-texto').style.width = p.txt.w + 'px';
      document.getElementById('wnd-texto').style.height = p.txt.h + 'px';
      document.getElementById('wnd-imagen').style.top = p.img.top + 'px';
      document.getElementById('wnd-imagen').style.left = p.img.left + 'px';
      document.getElementById('wnd-imagen-body').style.transform = 'none';
      document.getElementById('wnd-botones').style.top = p.btns.top + 'px';
      document.getElementById('wnd-botones').style.left = p.btns.left + 'px';
      document.documentElement.style.setProperty('--btns-gap', p.btns.gap + 'px');
      document.documentElement.style.setProperty('--btn-w', p.btns.btnW + 'px');
      document.documentElement.style.setProperty('--btn-h', p.btns.btnH + 'px');
      document.documentElement.style.setProperty('--btn-scale', p.btns.scale / 100);
      document.getElementById('wnd-cerrar').style.top = p.cerrar.top + 'px';
      document.getElementById('wnd-cerrar').style.left = p.cerrar.left + 'px';
      document.getElementById('wnd-cerrar').style.transform = 'scale(' + (p.cerrar.scale / 100) + ')';
    };
    window.limpiarCrearPos = function() {
      ['wnd-png', 'wnd-titulo', 'wnd-texto', 'wnd-imagen', 'wnd-botones', 'wnd-cerrar'].forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.style.top = '';
        el.style.left = '';
        el.style.width = '';
        el.style.height = '';
        el.style.transform = '';
      });
      ['wnd-titulo-body', 'wnd-texto-body', 'wnd-imagen-body', 'wnd-botones-body'].forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.style.transform = '';
        el.style.zoom = '';
      });
      document.documentElement.style.removeProperty('--btns-gap');
      document.documentElement.style.removeProperty('--btn-w');
      document.documentElement.style.removeProperty('--btn-h');
      document.documentElement.style.removeProperty('--btn-scale');
      document.documentElement.style.removeProperty('--crear-inp-h');
      document.documentElement.style.removeProperty('--crear-inp-w');
      document.documentElement.style.removeProperty('--crear-sel-w');
    };
  </script>
