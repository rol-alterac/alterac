<p>Corin ha consolidado alianzas con Brennen (la boda de Sir Swayer con Lady Agatha Brennen, aunque Sir Adrien Valcrest la desafió a justas) y mantiene correspondencia constante con Angela Brennen para coordinar estrategias. Su coronel Augustus von Stein, artífice de la quema de Strahnbrad, lidera sus tropas con mano de hierro. Sin embargo, la tragedia golpeó a la familia: Thevan Vallend, padre de Avery, fue decapitado por orden de la Reina Karynka de Stromgarde, y su cabeza enviada como mensaje. La supuesta captura de Bastión Dum por Zdenek Dum trastocó el norte, pero el desenlace demostró quién movía realmente los hilos: Corin Vallend. Avery, rescatada del norte, anuló su matrimonio con Odseer y se unió a Dum, anexionando así a la antigua Casa Dum —y sus islas— bajo la órbita Vallend. Dum recuperó las Tierras Altas como vasallo de Corin, que garantiza su protección a cambio de lealtad y alimentos. El Rey aprobó el acuerdo. En el plano personal, Corin rechazó un matrimonio con Karolina Heldt, señal de su independencia política incluso frente a la Corona, pues ya no necesita más alianzas: su poder en el norte es absoluto.</p>

    content: `<h3>Casa Miranthys — La Baronía Minera</h3>
<p><b>Lord Cassius Miranthys</b>, Consejero de Eventos, ha transformado su baronía montañosa en una potencia económica. Durante generaciones, los Miranthys han combatido a Stromgarde con tácticas de guerrilla, trampas y emboscadas en las montañas; sus famosos linces gigantes siembran el terror en el campo de batalla. En la Guerra Civil sus linces participaron en la Batalla de las Mil Colinas taponando brechas en las líneas mercenarias, y en Strahnbrad ejecutaron una emboscada devastadora aunque 200 de 300 murieron en las llamas. Cassius descubrió mithril en las montañas del Quebrado, y la baronía exporta el mineral más preciado del reino para armaduras y armas. Los enanos cavan un túnel bajo la montaña hacia tierras Montrose. Durante la excavación, encontraron un dragón en las profundidades; Cassius dirigió una expedición que lo abatió, y su cabeza decora la torre del castillo mientras sus escamas se forjan en armaduras legendarias.</p>
<p>Enfrentó una grave crisis religiosa al permitir el culto al Santo Fuego: la capilla fue quemada por una turba enfurecida después de que un devoto dejara ciego al sacerdote de la Llama Maestre Liniu Ganniux. Mario Arkanthos, el emisario convertido al Santo Fuego, fue torturado con la lengua cortada y encerrado. Cassius promulgó leyes draconianas —pena de muerte por posesión de libros del Santo Fuego— y el Príncipe Kuno condenó las medidas como "deleznables", pero Cassius se defendió citando los ataques stromgardianos. Arkanthos murió inmolado espontáneamente en su celda, gritando el nombre del Santo Fuego a pesar de no tener lengua; su familia recibió tierras en El Quebrado. En octubre, un brote de viruela mató a ~1.300 personas en Myrann; Cassius lideró una marcha de 2.000 personas pidiendo ayuda médica, impuso cuarentena y toque de queda, y El Quebrado abasteció a la ciudad sitiada por la enfermedad. En las Cavernas Llameantes, un ayuno de tres días le dejó una misteriosa quemadura en el rostro, y perdió un ojo que reemplazó con un ojo de mithril. La epidemia terminó cuando las Cavernas Llameantes explotaron. Cassius fue nombrado Conde de Myrann y El Quebrado por decreto real. En lo constructivo, inició <b>Freiheit</b> en El Quebrado —un nuevo valle cálido de cítricos, minería y viñedos—, completó Las Tres Hermanas (tres fortalezas en medialuna en el lago para defensa contra Stromgarde) y los Pasillos Llameantes (templo subterráneo de la Llama). Cassius acudió a Lagerfreuer a velar el cuerpo de Lord Esmeril Brennen en noviembre.</p>

<p>La Casa Othmar desempeñó un papel crucial en la Guerra Civil con una de las gestas más legendarias del reino. <b>Sir Ewald Othmar</b>, hijo intermedio de la casa que se enroló como sargento por petición propia, lideró a "Los Cien de Ewald" —los últimos cien soldados en pie— tras quedar como único sargento superviviente. Pronunció un discurso inmortal: "Ya estamos muertos. El enemigo cree que estamos acabados... pero lo que no saben es que no hay nada más temido en esta tierra que un soldado que sabe que ya está muerto". Resistieron toda la noche contra 800 soldados del Cuerpo Expedicionario Gilneano hasta la llegada del Ejército Real, infligiendo más de 430 bajas. Los Cien cayeron, pero su memoria se convirtió en leyenda. <b>Lord Darrek Othmar</b>, nombrado Consejero de Hacienda y Reclutamiento, es una figura imponente y temperamental —un "orangután de los Othmar"— que llegó a entrenar personalmente al Rey Soren en combate, saltando desde un balcón al patio y golpeando al monarca múltiples veces durante las prácticas. Perdió su puesto en el Consejo pero sigue siendo uno de los instructores marciales del Rey.</p>
<p>La casa explota canteras que proveen la piedra para las reconstrucciones del reino: Nueva Strahnbrad, Corinstadt, el Camino Real, y todos los grandes proyectos de Alterac. Inarus Stagger inició negociaciones comerciales para comprar piedra de las canteras Othmar, madera de Kolbeck y mithril de Miranthys. Othmar proporcionó apoyo táctico crucial a Ayamonte durante la defensa de la Isla del Purgatorio con tres shirdal (bestias aladas) y barcos incendiarios que inclinaron la Batalla de los Percebes. Sir Saskia Othmar, hija de Meinolf, ha sido propuesta en matrimonio a Sir Mateo Ayamonte; Saskia es una luchadora consumada que derrotó a Mateo en su primer entrenamiento, colocándole una espada de madera en el cuello, y desde entonces lo entrena a diario con feroz determinación. La Casa Othmar ha demostrado su valía en la guerra contra los gnolls en Luxtón, donde sus soldados emergieron del bosque para masacrar a las criaturas con "la crueldad de una venganza implacable", ganándose derechos sobre el botín. En la guerra, Othmar fue asignado al Grupo C en Lanza del Cuervo. Sin embargo, las tensiones con otras casas son notables: Darrek Othmar y Leiv Perenolde se enzarzaron en una pelea física —cabezazo y puñetazo— que acabó con ambos en la enfermería. El carácter orgulloso y belicoso de los Othmar es tan famoso como sus canteras.</p>

<h3>RESUMEN GENERAL</h3>
<p><b>Alterac</b> ha emergido de una devastadora guerra civil que ha dejado cicatrices profundas en todo el reino. La guerra, que enfrentó a los lealistas contra los rebeldes de las Casas Perenolde, Montrose y Falconcrest, culminó con la victoria de la Corona en la Batalla del Grajo, donde Madds Perenolde fue decapitado por uno de sus propios soldados. Sin embargo, la paz ha sido frágil y el reino se encuentra ahora al borde de una guerra total contra Stromgarde.</p>

<p>La primavera trajo abundancia a los campos alteraquí, con cosechas récord, pero el verano y el otoño han traído vientos de guerra. La economía, que mostraba signos de recuperación, se ha visto forzada a un rearme acelerado. El Rey Soren IV decretó el aumento de levas y una subida de impuestos del 10%, y tras la crisis de noviembre ha ordenado el reclutamiento forzoso de 3.500 soldados. La Real Fundación del Príncipe Kuno lleva ayuda humanitaria a las aldeas, ganando un enorme apoyo popular.</p>

<p>Las tensiones internas han ido <b>in crescendo</b>. La crisis Vallend-Stagger por las Hinterlands se resolvió diplomáticamente, pero la desconfianza entre las grandes casas se mantuvo. En septiembre estalló la batalla por Las Tres Hermanas entre la alianza Brennen-Miranthys y Stagger. En octubre, la supuesta invasión de Zdenek Dum sacudió el norte: capturó Bastión Dum y al Duque Corin Vallend, proclamándose Rey de las Tierras Altas. Sin embargo, el desenlace reveló que todo fue una maniobra de Vallend: Dum, exiliado durante generaciones, recuperó las Tierras Altas como casa vasalla de Corin, que consolidó su poder absoluto en el norte al anexionar a la antigua dinastía. La unión de Avery con Dum selló el pacto, asegurando a Vallend lealtad y alimento para sus ejércitos.</p>

<p>Religiosamente, el reino está más dividido que nunca. Hans Brennen, de 16 años, fue elegido Sumo Sacerdote de la Llama tras una reñida elección en febrero. La crisis del Santo Fuego en Miranthys dejó un reguero de sangre, con Mario Arkanthos torturado y la capilla quemada. El Arzobispo Theodosius III de Ventormenta llegó a Alterac, realizó un milagro en las Hinterlands, y fue asesinado en Lindhaven en noviembre, un acto atribuido a Stromgarde que ha desencadenado la crisis definitiva.</p>

<p>La Casa Brennen ha declarado la movilización total: 9.000 carbones marchan hacia el Muro de Fuego. Lord Inarus Stagger, investido Mano del Rey, coordina la respuesta bélica desde su lecho de herido. El Torneo de las Tierras Altas finalmente se celebró en octubre, pero la prevista visita de la Princesa Elaine-Katherine de Gilneas quedó en vilo tras el atentado contra su padre el Rey Archivald. El futuro de Alterac es incierto: la primavera de prosperidad ha dado paso al otoño de la guerra.</p>

function renderHouses() {
  const grid = document.getElementById('housesGrid');
  houses.forEach(h => {
    const btn = document.createElement('button');
    btn.className = 'house-btn';
    btn.textContent = h.name;
    btn.dataset.house = h.id;
    btn.addEventListener('click', () => selectHouse(h.id));
    grid.appendChild(btn);
  });
}

function showView(view) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.top-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.house-btn').forEach(b => b.classList.remove('active'));
  if (view === 'reino') {
    document.getElementById('viewReino').classList.add('active');
    document.getElementById('btnReino').classList.add('active');
  } else if (view === 'ultimos') {
    document.getElementById('viewUltimos').classList.add('active');
    document.getElementById('btnUltimos').classList.add('active');
  } else if (view === 'stromgarde') {
    document.getElementById('viewStromgarde').classList.add('active');
    document.getElementById('btnStromgarde').classList.add('active');
  } else if (view === 'consejo') {
    document.getElementById('viewConsejo').classList.add('active');
    document.getElementById('btnConsejo').classList.add('active');
  }
}

function selectHouse(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.top-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.house-btn').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`.house-btn[data-house="${id}"]`);
  if (btn) btn.classList.add('active');
  document.getElementById('viewCasa').classList.add('active');
  document.getElementById('houseContent').innerHTML = houseContents[id] || '<p>Selecciona una casa.</p>';
}
